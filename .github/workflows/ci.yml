name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build and verify
        # platform-test's IT needs Docker (Testcontainers) and drives 4 forked JVMs end-to-end;
        # skipped here to keep CI fast and Docker-free — run it locally via CLAUDE.md instead.
        run: ./mvnw -B -V clean verify -DskipITs=true
      - name: Compile the custom OpenRewrite recipes
        # Deliberately outside the reactor's <modules> (ad hoc, not part of the build — see
        # CLAUDE.md), but its source still lives in this repo, so compile-check it here.
        run: cd tooling/openrewrite-one-param-per-line && mvn -B -V compile
