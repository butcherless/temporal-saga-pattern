# Local development infrastructure: PostgreSQL + Temporal Server + Temporal Web UI + pgAdmin.
# No Kafka here — Activities call the business services directly over HTTP (see docs/temporal-saga-proposal.md).
# Plaintext credentials: local development only, never for production.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: saga-temporal-postgres
    # Default max_connections=100 saturates once the Temporal server's own SQL persistence pool
    # (~40 conns across the temporal/temporal_visibility stores) shares this instance with the
    # three business services' Hikari+R2DBC pools (~20 conns each) — bump the ceiling so ad hoc
    # psql/pgAdmin sessions aren't locked out during local development.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_MULTIPLE_DATABASES: order_db,inventory_db,payment_db
    ports:
      - "5432:5432"
    volumes:
      # Since PostgreSQL 18, the official image expects the mount point at /var/lib/postgresql
      # (not .../data): it stores data in a subdirectory named after the major version.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U saga" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once against the same Postgres container above (creating the "temporal" and
  # "temporal_visibility" databases and their schema), then exits; the "temporal" service below
  # only starts once this completes successfully. Official temporalio/samples-server pattern
  # (compose/docker-compose-postgres.yml) — temporalio/auto-setup, the older all-in-one image, is
  # deprecated.
  temporal-schema-setup:
    image: temporalio/admin-tools:1.31.2
    container_name: saga-temporal-schema-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: saga
      POSTGRES_PWD: saga
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: saga
    volumes:
      - ./docker/temporal/scripts:/scripts:ro
    entrypoint: [ "/bin/sh" ]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.31.2
    container_name: saga-temporal
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: saga
      POSTGRES_PWD: saga
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:2.53.3
    container_name: saga-temporal-ui
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      - temporal

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saga-temporal-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
