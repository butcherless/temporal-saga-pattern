server:
  port: 8081

spring:
  application:
    name: order-service
  webflux:
    problemdetails:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
    username: ${DB_USERNAME:saga}
    password: ${DB_PASSWORD:saga}
  # JDBC datasource used only by Flyway and by DataSourceAutoConfiguration's primary
  # DataSource bean (re-imported in the application class); the app itself talks to
  # PostgreSQL reactively via spring.r2dbc above.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
    username: ${DB_USERNAME:saga}
    password: ${DB_PASSWORD:saga}
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:localhost:7233}

---
spring:
  config:
    activate:
      on-profile: '!local'

# Structured (ECS) console logging outside local dev, via Spring Boot 4.1's built-in
# logging.structured.format.* support instead of a hand-maintained logback-spring.xml — with
# micrometer-tracing on the classpath, this automatically embeds trace/span IDs in every line, no
# custom encoder needed. Kept out of the local profile: platform-test/scripts/e2e-*.sh grep
# plain-text substrings (e.g. "activityType=ReserveStock") out of console output redirected to a
# file, and JSON is also just harder to read interactively during spring-boot:run.
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: local

# DEBUG for this app's own code only (not Spring/Temporal/R2DBC/etc). logging.file.name gives
# local dev a persistent /tmp trace file via Spring Boot's own rolling file appender (no custom
# logback-spring.xml needed); clean-history-on-start approximates the previous custom appender's
# fresh-file-per-run behavior as closely as the built-in rolling policy allows — the *current*
# file itself still gets appended to across restarts within a policy period, unlike the old
# append=false FileAppender.
logging:
  level:
    com.company.saga: DEBUG
  file:
    name: /tmp/order-service.log
  logback:
    rollingpolicy:
      clean-history-on-start: true
