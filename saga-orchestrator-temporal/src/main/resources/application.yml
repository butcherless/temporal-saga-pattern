server:
  port: 8080

spring:
  application:
    name: saga-orchestrator-temporal
  # Socket-level timeouts for every auto-configured HTTP client (the three business-service
  # WebClients built in ActivityWebClientConfig) — previously there was none at all except
  # OrderSagaWorkflowImpl's ActivityOptions#setStartToCloseTimeout(10s), a workflow-level guard,
  # not a socket-level one: a hung TCP connection was indistinguishable from a slow business
  # service until that 10s elapsed. read-timeout stays comfortably under that 10s so a stalled
  # response fails at the HTTP client first, with a clearer error than a bare Activity timeout.
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:localhost:7233}
    workers:
      - task-queue: order-saga-task-queue
        workflow-classes:
          - com.company.saga.orchestrator.workflow.OrderSagaWorkflowImpl
        activity-beans:
          - inventoryActivitiesImpl
          - paymentActivitiesImpl
          - orderActivitiesImpl

services:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

---
spring:
  config:
    activate:
      on-profile: '!local'

# Structured (ECS) console logging outside local dev, via Spring Boot 4.1's built-in
# logging.structured.format.* support instead of a hand-maintained logback-spring.xml — with
# micrometer-tracing on the classpath, this automatically embeds trace/span IDs in every line, no
# custom encoder needed. Kept out of the local profile: platform-test/scripts/e2e-*.sh grep
# plain-text substrings (e.g. "activityType=ReserveStock") out of console output redirected to a
# file, and JSON is also just harder to read interactively during spring-boot:run.
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: local

# DEBUG for this app's own code only (not Spring/Temporal/etc). logging.file.name gives local
# dev a persistent /tmp trace file via Spring Boot's own rolling file appender (no custom
# logback-spring.xml needed); clean-history-on-start approximates the previous custom appender's
# fresh-file-per-run behavior as closely as the built-in rolling policy allows — the *current*
# file itself still gets appended to across restarts within a policy period, unlike the old
# append=false FileAppender.
logging:
  level:
    com.company.saga: DEBUG
  file:
    name: /tmp/saga-orchestrator-temporal.log
  logback:
    rollingpolicy:
      clean-history-on-start: true
